<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التدريب - Unit 1 & 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-start { background: #27ae60; color: #fff; }
        .btn-start:hover { background: #219150; }
        
        .question-box { display: none; }
        .progress { text-align: center; color: #7f8c8d; margin-bottom: 10px; font-weight: bold; }
        .question-text { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; border-right: 4px solid #3498db; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fafafa; font-size: 16px; }
        .option:hover { border-color: #3498db; }
        .option.selected { border-color: #3498db; background: #ebf5fb; }
        .option.correct { border-color: #27ae60; background: #eafaf1; }
        .option.wrong { border-color: #e74c3c; background: #fdedec; }
        .option.disabled { pointer-events: none; }
        
        .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .actions .btn { flex: 1; min-width: 100px; margin-top: 0; padding: 12px 8px; font-size: 14px; }
        .btn-prev { background: #95a5a6; color: #fff; }
        .btn-prev:hover { background: #7f8c8d; }
        .btn-reveal { background: #f39c12; color: #fff; }
        .btn-reveal:hover { background: #d68910; }
        .btn-next { background: #27ae60; color: #fff; }
        .btn-next:hover { background: #219150; }
        .feedback { margin-top: 15px; font-weight: bold; text-align: center; display: none; font-size: 16px; padding: 10px; border-radius: 8px; }

        .result-box { display: none; text-align: center; }
        .score { font-size: 56px; font-weight: bold; color: #27ae60; margin: 20px 0; }
        .score-details { font-size: 18px; color: #34495e; margin-bottom: 20px; line-height: 1.8; }
        .score-card { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .score-item { background: #f8f9fa; padding: 15px 25px; border-radius: 10px; min-width: 120px; border-right: 4px solid #3498db; }
        .score-item.correct-score { border-right-color: #27ae60; }
        .score-item.wrong-score { border-right-color: #e74c3c; }
        .score-item .num { font-size: 28px; font-weight: bold; display: block; }
        .btn-restart { background: #e67e22; color: #fff; }
        .btn-restart:hover { background: #d35400; }
        .btn-wrong { background: #e74c3c; color: #fff; }
        .btn-wrong:hover { background: #c0392b; }

        .wrong-review-box { display: none; }
        .wrong-review-box h2 { color: #e74c3c; }
        .wrong-card { background: #fdf2f2; border-right: 5px solid #e74c3c; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: right; }
        .wrong-card .q-text { font-weight: bold; margin-bottom: 10px; font-size: 16px; color: #2c3e50; }
        .wrong-card .your-ans { color: #e74c3c; margin-bottom: 5px; }
        .wrong-card .correct-ans { color: #27ae60; font-weight: bold; }
        .back-btn { background: #3498db; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">

    <div id="setupScreen">
        <h2> تدريب على الوحدتين الاولى والثانية</h2>
	    <h2> في حال وجود إجابة غير دقيقة يرجى مراجعة الشرح  </h2>

        <div class="form-group">
            <label>عدد الأسئلة:</label>
            <input type="number" id="numQuestions" min="1" value="10">
        </div>
        <div class="form-group">
            <label>الوحدة (Unit):</label>
            <select id="filterUnit" onchange="updateFiles()"><option value="">الكل</option></select>
        </div>
        <div class="form-group">
            <label>الملف / الدرس (File Name):</label>
            <select id="filterFile" onchange="updateTopics()"><option value="">الكل</option></select>
        </div>
        <div class="form-group">
            <label>الموضوع الرئيسي (Main Topic):</label>
            <select id="filterMain" onchange="updateSubTopics()"><option value="">الكل</option></select>
        </div>
        <div class="form-group">
            <label>الموضوع الفرعي (Sub-Topic):</label>
            <select id="filterSub"><option value="">الكل</option></select>
        </div>
        <div class="form-group">
            <label>نوع السؤال (Type):</label>
            <select id="filterType"><option value="">الكل</option></select>
        </div>
        <button class="btn btn-start" onclick="startQuiz()">ابدأ التدريب</button>
    </div>

    <div id="quizScreen" class="question-box">
        <div class="progress" id="progressText"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackText"></div>
        <div class="actions">
            <button class="btn btn-prev" id="prevBtn" onclick="prevQuestion()">السابق</button>
            <button class="btn btn-reveal" id="revealBtn" onclick="revealAnswer()">عرض الإجابة</button>
            <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div id="resultScreen" class="result-box">
        <h2>النتيجة النهائية</h2>
        <div class="score" id="scoreText">0%</div>
        <div class="score-card">
            <div class="score-item correct-score">
                <span class="num" id="correctCount">0</span>
                إجابات صحيحة
            </div>
            <div class="score-item wrong-score">
                <span class="num" id="wrongCount">0</span>
                إجابات خاطئة
            </div>
            <div class="score-item">
                <span class="num" id="totalCount">0</span>
                إجمالي الأسئلة المجابة
            </div>
        </div>
        <div class="score-details" id="scoreDetails"></div>
        <button class="btn btn-wrong" id="viewWrongBtn" onclick="viewWrongAnswers()">عرض الأسئلة الخطأ</button>
        <button class="btn btn-restart" onclick="location.reload()">تدريب جديد</button>
    </div>

    <div id="wrongReviewScreen" class="wrong-review-box">
        <h2>الأسئلة التي أخطأت فيها</h2>
        <div id="wrongContainer"></div>
        <button class="btn back-btn" onclick="backToResult()">رجوع للنتيجة</button>
    </div>

</div>

    ];

    // =========================================================
    // [2] دوال الفلترة التفاعلية (المترابطة)
    // =========================================================
    function populateSelect(selectId, optionsArray) {
        const select = document.getElementById(selectId);
        select.innerHTML = '<option value="">الكل</option>';
        optionsArray.forEach(opt => {
            select.innerHTML += `<option value="${opt}">${opt}</option>`;
        });
    }

    // لما الوحدة تتغير: نحدث الملفات ونفضي الباقي
    function updateFiles() {
        const unit = document.getElementById('filterUnit').value;
        const filtered = unit ? allQuestions.filter(q => q.unit === unit) : allQuestions;
        const files = [...new Set(filtered.map(q => q.file))];
        populateSelect('filterFile', files);
        updateTopics(); // نحدث التوبكس
    }

    // لما الملف يتغير: نحدث التوبكس ونفضي الباقي
    function updateTopics() {
        const unit = document.getElementById('filterUnit').value;
        const file = document.getElementById('filterFile').value;
        
        let filtered = allQuestions;
        if (unit) filtered = filtered.filter(q => q.unit === unit);
        if (file) filtered = filtered.filter(q => q.file === file);

        const mains = [...new Set(filtered.map(q => q.main))];
        populateSelect('filterMain', mains);
        updateSubTopics(); // نحدث السب توبكس
    }

    // لما التوبك يتغير: نحدث السب توبكس
    function updateSubTopics() {
        const unit = document.getElementById('filterUnit').value;
        const file = document.getElementById('filterFile').value;
        const main = document.getElementById('filterMain').value;
        
        let filtered = allQuestions;
        if (unit) filtered = filtered.filter(q => q.unit === unit);
        if (file) filtered = filtered.filter(q => q.file === file);
        if (main) filtered = filtered.filter(q => q.main === main);

        const subs = [...new Set(filtered.map(q => q.sub))];
        populateSelect('filterSub', subs);
    }

    // تعبئة القوائم لأول مرة عند تحميل الصفحة
    function initFilters() {
        const units = [...new Set(allQuestions.map(q => q.unit))];
        const types = [...new Set(allQuestions.map(q => q.type))];
        populateSelect('filterUnit', units);
        populateSelect('filterType', types);
        updateFiles(); // دي هتطلق باقي التحديثات
    }
    initFilters();

    // =========================================================
    // [3] إعدادات الحماية البسيطة
    // =========================================================
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) {
            e.preventDefault();
            alert("غير مسموح بفتح أدوات المطور.");
        }
    });

    // =========================================================
    // [4] متغيرات الاختبار
    // =========================================================
    let quizQuestions = [];
    let userAnswers = [];
    let currentIndex = 0;

    // =========================================================
    // [5] بدء الاختبار
    // =========================================================
    function startQuiz() {
        const num = parseInt(document.getElementById('numQuestions').value);
        const fUnit = document.getElementById('filterUnit').value;
        const fFile = document.getElementById('filterFile').value;
        const fMain = document.getElementById('filterMain').value;
        const fSub = document.getElementById('filterSub').value;
        const fType = document.getElementById('filterType').value;

        let filtered = allQuestions.filter(q => 
            (!fUnit || q.unit === fUnit) &&
            (!fFile || q.file === fFile) &&
            (!fMain || q.main === fMain) &&
            (!fSub || q.sub === fSub) &&
            (!fType || q.type === fType)
        );

        if (filtered.length === 0) return alert("لا توجد أسئلة مطابقة للفلترة المحددة.");

        filtered = filtered.sort(() => 0.5 - Math.random());
        quizQuestions = filtered.slice(0, num);
        
        userAnswers = new Array(quizQuestions.length).fill(null);
        
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        
        currentIndex = 0;
        showQuestion();
    }

    // =========================================================
    // [6] عرض السؤال
    // =========================================================
    function showQuestion() {
        const q = quizQuestions[currentIndex];
        const savedChoice = userAnswers[currentIndex];
        
        document.getElementById('progressText').innerText = `السؤال ${currentIndex + 1} من ${quizQuestions.length}`;
        document.getElementById('questionText').innerText = q.question;
        
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        const letters = ['A', 'B', 'C', 'D'];
        letters.forEach((letter, index) => {
            if (q[letter] && q[letter].trim() !== "") {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = `${letter}) ${q[letter]}`;
                
                // لو فيه إجابة محفوظة، نعلم عليها كلون أزرق
                if (savedChoice === String(index + 1)) {
                    div.classList.add('selected');
                }
                
                div.onclick = () => selectOption(div, String(index + 1)); 
                optionsContainer.appendChild(div);
            }
        });

        document.getElementById('prevBtn').style.display = currentIndex === 0 ? 'none' : 'block';
        document.getElementById('nextBtn').style.display = 'block';
        document.getElementById('nextBtn').innerText = (currentIndex === quizQuestions.length - 1) ? "عرض النتيجة" : "التالي";
        
        document.getElementById('revealBtn').style.display = 'block';
        document.getElementById('feedbackText').style.display = 'none';
        
        document.querySelectorAll('.option').forEach(opt => {
            opt.classList.remove('correct', 'wrong', 'disabled');
        });
    }

    // =========================================================
    // [7] اختيار الإجابة (التسجيل الفوري)
    // =========================================================
    function selectOption(element, ansValue) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        userAnswers[currentIndex] = ansValue;
    }

    // =========================================================
    // [8] عرض الإجابة الصحيحة
    // =========================================================
    function revealAnswer() {
        const q = quizQuestions[currentIndex];
        const savedChoice = userAnswers[currentIndex];
        
        if (!savedChoice) {
            alert("من فضلك اختر إجابة أولاً قبل عرض الإجابة الصحيحة.");
            return;
        }
        
        const options = document.querySelectorAll('.option');
        const feedback = document.getElementById('feedbackText');
        const letters = ['A', 'B', 'C', 'D'];
        let optionIndex = 0;
        
        letters.forEach((letter, i) => {
            if (q[letter] && q[letter].trim() !== "") {
                const opt = options[optionIndex];
                opt.classList.add('disabled');
                opt.classList.remove('selected');
                
                if (String(i + 1) === q.ans) opt.classList.add('correct');
                if (String(i + 1) === savedChoice && savedChoice !== q.ans) opt.classList.add('wrong');
                
                optionIndex++;
            }
        });

        if (savedChoice === q.ans) {
            feedback.innerText = "✅ إجابة صحيحة!";
            feedback.style.color = "#27ae60";
            feedback.style.backgroundColor = "#eafaf1";
        } else {
            feedback.innerText = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${letters[parseInt(q.ans) - 1]})`;
            feedback.style.color = "#e74c3c";
            feedback.style.backgroundColor = "#fdedec";
        }
        feedback.style.display = 'block';
        document.getElementById('revealBtn').style.display = 'none';
    }

    // =========================================================
    // [9] التنقل بين الأسئلة
    // =========================================================
    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    function nextQuestion() {
        if (currentIndex === quizQuestions.length - 1) {
            showResult();
        } else {
            currentIndex++;
            showQuestion();
        }
    }

    // =========================================================
    // [10] عرض النتيجة النهائية
    // =========================================================
    function showResult() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        
        let score = 0;
        let wrong = 0;
        
        quizQuestions.forEach((q, i) => {
            if (userAnswers[i]) {
                if (userAnswers[i] === q.ans) {
                    score++;
                } else {
                    wrong++;
                }
            }
        });
        
        const totalAnswered = score + wrong;
        const percentage = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0;
        
        document.getElementById('scoreText').innerText = `${percentage}%`;
        document.getElementById('correctCount').innerText = score;
        document.getElementById('wrongCount').innerText = wrong;
        document.getElementById('totalCount').innerText = totalAnswered;
        
        let msg = `لقد أجبت بشكل صحيح على ${score} أسئلة من أصل ${totalAnswered} سؤال قمت بحلهم.`;
        if (totalAnswered < quizQuestions.length) {
            msg += `<br>⚠️ لم تقم بالإجابة على ${quizQuestions.length - totalAnswered} سؤال.`;
        }
        if (percentage === 100 && totalAnswered > 0) msg += "<br>🎉 ممتاز! أداء مثالي!";
        else if (percentage >= 70) msg += "<br>💪 جيد جداً! استمر في التقدم.";
        else if (percentage >= 50) msg += "<br>📖 مقبول، تحتاج إلى مراجعة بسيطة.";
        else if (totalAnswered > 0) msg += "<br>📚 يجب عليك مراجعة المادة جيداً.";
        
        document.getElementById('scoreDetails').innerHTML = msg;
        
        document.getElementById('viewWrongBtn').style.display = wrong > 0 ? 'block' : 'none';
    }

    // =========================================================
    // [11] عرض الأسئلة الخطأ
    // =========================================================
    function viewWrongAnswers() {
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('wrongReviewScreen').style.display = 'block';
        
        const container = document.getElementById('wrongContainer');
        container.innerHTML = '';
        
        const letters = ['A', 'B', 'C', 'D'];
        let wrongCount = 0;
        
        quizQuestions.forEach((q, i) => {
            if (userAnswers[i] && userAnswers[i] !== q.ans) {
                wrongCount++;
                const userChoice = userAnswers[i];
                const userLetter = letters[parseInt(userChoice) - 1];
                const userText = q[userLetter];
                const correctLetter = letters[parseInt(q.ans) - 1];
                const correctText = q[correctLetter];
                
                const card = document.createElement('div');
                card.className = 'wrong-card';
                card.innerHTML = `
                    <div class="q-text">${i + 1}. ${q.question}</div>
                    <div class="your-ans">❌ إجابتك: (${userLetter}) ${userText}</div>
                    <div class="correct-ans">✅ الإجابة الصحيحة: (${correctLetter}) ${correctText}</div>
                `;
                container.appendChild(card);
            }
        });
        
        if (wrongCount === 0) {
            container.innerHTML = '<p style="text-align:center; font-size:18px; color:#27ae60;">🎉 ممتاز! لم تخطئ في أي سؤال قمت بإجابته.</p>';
        }
    }

    // =========================================================
    // [12] الرجوع للنتيجة
    // =========================================================
    function backToResult() {
        document.getElementById('wrongReviewScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
    }
</script>
